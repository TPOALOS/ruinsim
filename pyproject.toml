[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ruinsim"
version = "1.0.0"
description = "Bootstrap your own trade list to see drawdown and risk of ruin at different position sizes, with Kelly sizing and block resampling for streaks. Pure Python, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["risk-of-ruin", "position-sizing", "kelly-criterion", "drawdown", "monte-carlo", "bootstrap", "trading", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/ruinsim"
Issues = "https://github.com/TPOALOS/ruinsim/issues"

[project.scripts]
ruinsim = "ruinsim.cli:main"

[tool.setuptools]
packages = ["ruinsim"]
